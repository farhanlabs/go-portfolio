name: CI/CD

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - 'k8s/**'
      - 'README.md'

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        run: go build -o go-portfolio

      - name: Test
        run: go test ./...

  code-quality:
    runs-on: self-hosted
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.56.2

  docker:
    runs-on: self-hosted
    needs: code-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/go-portfolio:${{ github.run_id }}

  update-helm:
    runs-on: self-hosted
    needs: docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      - name: Update Helm tag
        run: |
          sed -i 's/tag: .*/tag: "${{ github.run_id }}"/' helm/go-portfolio-chart/values.yaml

      - name: Commit and Push
        run: |
          git config user.name "farhanlabs"
          git config user.email "mdfarhanraza001@gmail.com"

          git add helm/go-portfolio-chart/values.yaml

          git diff --cached --quiet || git commit -m "Update image tag to ${{ github.run_id }}"

          git push