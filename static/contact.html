<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Md Farhan Raza</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">
    <!-- Navbar -->
    <nav class="sticky top-0 z-50 backdrop-blur-md bg-slate-900/80 border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="/" class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">Farhan Raza</a>
            <div class="hidden md:flex space-x-6 text-sm font-medium">
                <a href="/" class="text-slate-400 hover:text-slate-100 transition">Home</a>
                <a href="/about" class="text-slate-400 hover:text-slate-100 transition">About</a>
                <a href="/projects" class="text-slate-400 hover:text-slate-100 transition">Projects</a>
                <a href="/dashboard" class="text-slate-400 hover:text-slate-100 transition">Dashboard</a>
                <a href="/contact" class="text-blue-400 transition">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Contact Section -->
    <section class="max-w-3xl mx-auto px-6 py-20">
        <h1 class="text-4xl font-extrabold tracking-tight mb-4">Get in Touch</h1>
        <p class="text-slate-400 mb-10">Have a project in mind or want to discuss cloud infrastructure and development? Feel free to drop a message.</p>

        <div class="p-8 rounded-2xl bg-slate-900 border border-slate-800">
            <form class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Your Name</label>
                    <input type="text" placeholder="John Doe" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white focus:outline-none focus:border-blue-500 transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Email Address</label>
                    <input type="email" placeholder="john@example.com" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white focus:outline-none focus:border-blue-500 transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Message</label>
                    <textarea rows="4" placeholder="Your message here..." class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white focus:outline-none focus:border-blue-500 transition"></textarea>
                </div>
                <button type="submit" class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-medium shadow-lg shadow-blue-500/25 transition">Send Message</button>
            </form>
        </div>
    </section>
</body>
</html>
