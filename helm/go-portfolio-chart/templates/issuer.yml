apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Let's Encrypt ka live server
    server: https://acme-v02.api.letsencrypt.org/directory
    # Apna koi bhi email yahan daal dein (expiry notifications ke liye)
    email: mdfarhanraza091@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
    - http01:
        ingress:
          class: nginx